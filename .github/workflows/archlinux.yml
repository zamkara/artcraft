name: Daily Arch Linux releases

on:
  schedule:
    # Daily at 03:17 Asia/Jakarta (20:17 UTC).
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: artcraft-${{ github.event_name == 'pull_request' && github.ref || 'suite' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.catalog.outputs.apps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate application registry
        id: catalog
        run: python3 .github/workflows/artcraft/registry.py >> "$GITHUB_OUTPUT"
      - name: Check workflow helpers and release planning
        run: |
          python3 -m unittest discover -s .github/workflows/artcraft -p 'test_*.py' -v
          bash -n .github/workflows/artcraft/build.sh
          bash -n .github/workflows/artcraft/tauri.PKGBUILD.in
          bash -n .github/workflows/artcraft/manager-build.sh
          bash -n .github/workflows/artcraft/install.sh.in
          python3 -m py_compile .github/workflows/artcraft/manager_prepare.py .github/workflows/artcraft/suite_publish.py
          python3 -m py_compile .github/workflows/artcraft/prepare.py .github/workflows/artcraft/publish.py .github/workflows/artcraft/validate.py
          python3 - <<'PYROOT'
          import subprocess
          entries = set(subprocess.check_output(['git', 'ls-tree', '--name-only', 'HEAD'], text=True).splitlines())
          missing = {'.github', 'LICENSE'} - entries
          unexpected = entries - {'.github', 'LICENSE', 'readme.md', 'README.md'}
          if missing or unexpected:
              raise SystemExit(f"Invalid repository root: missing={sorted(missing)}, unexpected={sorted(unexpected)}")
          print('Repository root verified.')
          PYROOT

  manager:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare Artcraft CLI
        id: manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/artcraft/manager_prepare.py --directory .github/workflows/.build/artcraft
      - name: Restore Rust cache
        if: steps.manager.outputs.changed == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .github/workflows/.build/artcraft/.cache
          key: arch-manager-${{ steps.manager.outputs.recipe }}-${{ steps.manager.outputs.tag }}
          restore-keys: arch-manager-
      - name: Build and verify native CLI
        if: steps.manager.outputs.changed == 'true'
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/workflows/.build/artcraft,dst=/build" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/workflows/artcraft,dst=/recipe,readonly" \
            archlinux:base-devel bash /recipe/manager-build.sh /build
      - name: Preserve CLI artifacts
        if: steps.manager.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artcraft-cli-${{ steps.manager.outputs.tag }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .github/workflows/.build/artcraft/*.pkg.tar.zst
            .github/workflows/.build/artcraft/artcraft-linux-x86_64
            .github/workflows/.build/artcraft/install.sh
            .github/workflows/.build/artcraft/PKGBUILD
            .github/workflows/.build/artcraft/.SRCINFO
            .github/workflows/.build/artcraft/upstream.json
            .github/workflows/.build/artcraft/SHA256SUMS
            .github/workflows/.build/artcraft/CHANGELOG.md

  package:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        app: ${{ fromJson(needs.validate.outputs.apps) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check upstream and prepare immutable source inputs
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
        run: python3 .github/workflows/artcraft/prepare.py "$APP" --directory ".github/workflows/.build/$APP"
      - name: Restore Rust build cache
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .github/workflows/.build/${{ matrix.app }}/.cache
          key: arch-x86_64-${{ matrix.app }}-${{ steps.upstream.outputs.recipe }}-${{ steps.upstream.outputs.tag }}
          restore-keys: |
            arch-x86_64-${{ matrix.app }}-${{ steps.upstream.outputs.recipe }}-
            arch-x86_64-${{ matrix.app }}-
      - name: Build and validate with Arch makepkg
        if: steps.upstream.outputs.changed == 'true'
        env:
          APP: ${{ matrix.app }}
        run: |
          # Free unused preinstalled SDKs in this disposable hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          if ! swapon --show --noheadings | grep -q .; then
            sudo fallocate -l 6G /swapfile-artcraft
            sudo chmod 600 /swapfile-artcraft
            sudo mkswap /swapfile-artcraft
            sudo swapon /swapfile-artcraft
          fi
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/workflows/.build/$APP,dst=/build" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/workflows/artcraft,dst=/recipe,readonly" \
            archlinux:base-devel bash /recipe/build.sh /build /recipe
      - name: Preserve validated package
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-${{ matrix.app }}-${{ steps.upstream.outputs.tag }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .github/workflows/.build/${{ matrix.app }}/*.pkg.tar.zst
            .github/workflows/.build/${{ matrix.app }}/PKGBUILD
            .github/workflows/.build/${{ matrix.app }}/.SRCINFO
            .github/workflows/.build/${{ matrix.app }}/upstream.json
            .github/workflows/.build/${{ matrix.app }}/SHA256SUMS
            .github/workflows/.build/${{ matrix.app }}/CHANGELOG.md

  publish:
    needs: [manager, package]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download all validated build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: .github/workflows/.artifacts
      - name: Publish one complete suite release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/artcraft/suite_publish.py --artifacts .github/workflows/.artifacts --repository "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
