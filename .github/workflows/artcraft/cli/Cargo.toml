[package]
name = "artcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Install and update native Storytold applications on Arch Linux"
license-file = "../../../../LICENSE"
repository = "https://github.com/zamkara/storytold"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
